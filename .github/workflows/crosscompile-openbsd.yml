name: Cross-Compile OpenBSD

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  openbsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_DIR=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_DIR }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Build web UI
        run: |
          cd ui/web
          pnpm install --frozen-lockfile
          pnpm build

      - name: Prepare web UI for embedding
        run: |
          rm -rf internal/webui/dist && mkdir -p internal/webui/dist
          cp -r ui/web/dist/* internal/webui/dist/

      - name: Build for OpenBSD amd64
        env:
          VERSION: ${{ github.ref_name == '' && 'dev' || github.ref_name }}
        run: |
          GOOS=openbsd GOARCH=amd64 CGO_ENABLED=0 go build \
            -tags "embedui sqlite" \
            -ldflags="-s -w -X github.com/nextlevelbuilder/goclaw/cmd.Version=$VERSION" \
            -o goclaw-openbsd-amd64 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: goclaw-openbsd-amd64
          path: goclaw-openbsd-amd64
          retention-days: 30